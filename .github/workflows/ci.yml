name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No lockfile: the dependencies resolve from the manifest's ranges, as they do in a consumer's project.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # The truth rebuilt from the committed hand files and snapshots must be the committed file; the tests check it, this shows the diff if not.
      - run: npm run truth && git diff --exit-code -- data/rendezvous.json docs/truth.md
      - run: npm pack --dry-run
